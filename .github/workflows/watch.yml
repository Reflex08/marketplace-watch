name: marketplace-watch

on:
  schedule:
    # Hourly, not every 15 min: 10 brand queries cost 10 credits a run, and new
    # Sur-Ron-class listings appear a few times a week, not a few times an hour.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python watch.py --selftest
      - run: python watch.py
        env:
          SCRAPECREATORS_KEY: ${{ secrets.SCRAPECREATORS_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          # altis motors / rawrr / ventus omitted on purpose — they return sneakers,
          # hockey cards and golf shafts. The brands stay in REQUIRE regardless.
          QUERIES: "surron,talaria,e ride pro,79bike,rfn apollo,segway dirt bike,electric dirt bike"
          LAT: "43.7615"
          LNG: "-79.4111"
          RADIUS_KM: "200"
          MAX_PRICE: "15000"
          PRIORITY_QUERIES: "surron,talaria"
          QUERIES_PER_RUN: "5"
          PAGES_PER_QUERY: "1"
          DATE_LISTED: "all"
          NEW_HOURS: "48"
          MAX_CHECKS: "8"
          MAX_ALERTS: "8"
          # PITCH is deliberately unset: leaving it blank lets watch.py compose a
          # different message per listing. Setting it forces one identical text to
          # every seller, which is the pattern Meta flags as spam.
      - name: persist state
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add seen.json pending.json
          git diff --quiet --cached || git commit -m "seen + pending state"
          git pull --rebase --autostash
          git push
