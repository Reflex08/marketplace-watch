name: marketplace-watch

on:
  schedule:
    # Hourly, not every 15 min: 10 brand queries cost 10 credits a run, and new
    # Sur-Ron-class listings appear a few times a week, not a few times an hour.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python watch.py --selftest
      - run: python watch.py
        env:
          SCRAPECREATORS_KEY: ${{ secrets.SCRAPECREATORS_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          QUERIES: "surron,talaria,e ride pro,79bike,rfn apollo,segway dirt bike,electric dirt bike,altis motors,rawrr,ventus"
          LAT: "43.7615"
          LNG: "-79.4111"
          RADIUS_KM: "100"
          MAX_PRICE: "15000"
          QUERIES_PER_RUN: "3"
          MAX_ALERTS: "6"
          PITCH: "Hey! Any interest in trading your bike for my go-kart? Runs great, can send pics and video of it going. Happy to add cash on top if needed."
      - name: persist seen state
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add seen.json
          git diff --quiet --cached || git commit -m "seen state"
          git push
