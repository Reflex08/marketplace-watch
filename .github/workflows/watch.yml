name: marketplace-watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python watch.py --selftest
      - run: python watch.py
        env:
          SCRAPECREATORS_KEY: ${{ secrets.SCRAPECREATORS_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          QUERY: ebike
          LAT: "43.7615"
          LNG: "-79.4111"
          RADIUS_KM: "60"
          MAX_PRICE: "1500"
          PITCH: "Hey! Any interest in trading your e-bike for my go-kart? Runs great, can send pics and video of it going."
      - name: persist seen state
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add seen.json
          git diff --quiet --cached || git commit -m "seen state"
          git push
